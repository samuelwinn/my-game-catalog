<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Famidash — Liqua</title>
<!-- Famidash: a Geometry Dash demake for NES. https://github.com/tfdsoft/famidash
     Emulator and Famidash v1.2.8 ROM match the working gn-math embed.
     EmulatorJS runtime: https://emulatorjs.org/docs/embed/ -->
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font:16px system-ui,Arial,sans-serif}
  #stage{height:100%;width:100%;position:relative;display:flex;align-items:center;justify-content:center}
  #game{height:100%;width:100%;display:none}
  #intro{text-align:center;max-width:90%;display:flex;align-items:center;flex-direction:column;gap:15px}
  #startButton{font:700 17px system-ui,Arial,sans-serif;border:0;border-radius:10px;background:#39aa67;color:#fff;padding:14px 40px;cursor:pointer}
  #startButton:focus-visible{outline:3px solid #fff;outline-offset:4px}
  #status{font-size:13px;color:#ced4df;max-width:500px;white-space:pre-wrap}
  #status[hidden]{display:none}
</style>
</head>
<body>
<div id="stage">
  <div id="intro">
    <button type="button" id="startButton">PLAY FAMIDASH</button>
    <div id="status" role="status" aria-live="polite" hidden></div>
  </div>
  <div id="game" aria-label="Famidash NES game"></div>
</div>
<script>
(function(){
 'use strict';
 const play=document.getElementById('startButton');
 const intro=document.getElementById('intro');
 const game=document.getElementById('game');
 const status=document.getElementById('status');
 let started=false;
 function showStatus(message){status.textContent=message;status.hidden=!message;}
 function showFailure(message){game.style.display='none';intro.style.display='flex';play.disabled=false;play.textContent='RETRY FAMIDASH';started=false;showStatus(message);}
 // A Google Sites iframe can have an opaque origin. EmulatorJS checks localStorage
 // and IndexedDB, which can throw SecurityError in that environment.
 function enableSandboxCompatibility(){
  try{
   const key='__liqua_emulator_storage_check__';
   window.localStorage.setItem(key,'1');
   window.localStorage.removeItem(key);
  }catch(error){
   const saved=new Map();
   const storage={
    getItem(key){key=String(key);return saved.has(key)?saved.get(key):null},
    setItem(key,value){saved.set(String(key),String(value))},
    removeItem(key){saved.delete(String(key))},
    clear(){saved.clear()},
    key(index){return Array.from(saved.keys())[index]??null},
    get length(){return saved.size}
   };
   try{Object.defineProperty(window,'localStorage',{configurable:true,value:storage})}catch(e){}
  }
  try{
   if(window.indexedDB){
    const req=window.indexedDB.open('__liqua_emulator_probe__');
    req.onsuccess=function(){try{req.result.close()}catch(e){}};
   }
  }catch(error){
   try{Object.defineProperty(window,'indexedDB',{configurable:true,value:undefined})}catch(e){}
  }
 }
 play.addEventListener('click',function(){
  if(started)return;
  started=true;
  play.disabled=true;
  showStatus('Loading Famidash...');
  enableSandboxCompatibility();
  window.EJS_player='#game';
  window.EJS_core='nes';
  window.EJS_color='#000000';
  window.EJS_startOnLoaded=true;
  window.EJS_gameName='Famidash';
  window.EJS_pathtodata='https://cdn.jsdelivr.net/gh/bubblfan/emu@master/';
  window.EJS_gameUrl='https://cdn.jsdelivr.net/gh/ap-math-class/exams@main/nes/Famidash.v1.2.8.nes';
  window.EJS_ready=function(){showStatus('');intro.style.display='none';};
  window.EJS_onGameStart=function(){showStatus('');intro.style.display='none';};
  game.style.display='block';
  const script=document.createElement('script');
  script.src='https://cdn.jsdelivr.net/gh/bubblfan/emu@master/loader.js';
  script.async=true;
  script.onerror=function(){showFailure('The emulator could not load. Check your internet connection or try again later.');};
  document.body.appendChild(script);
 });
 window.addEventListener('unhandledrejection',function(event){
  if(!started)return;
  showStatus('An emulator resource failed to load. Open this game in a new tab, or try again later.');
 });
})();
</script>
</body>
</html>
